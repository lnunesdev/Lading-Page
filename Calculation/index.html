<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        body{
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculator {
            text-align: center;
            border: 2px rgb(255, 255, 255) solid;
            border-radius: 10px;
            padding: 10px;
            height: 350px;
            width: 200px;
        }

        .eval {
            font-family: 'Times New Roman', Times, serif;
            color: white;
            border: 2px rgb(255, 255, 255) solid;
            border-radius: 10px;
            height: 40px;
            width: 135px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .clear {
            text-align: center;
            align-items: center;
            border-radius: 10px;
            margin: 20px auto;
            width: 180px;
            display: block;
        }

        button{
            color: white;
            background-color: gray;
            border-radius: 50%;
            border: none;
            padding: 7px;
            margin: 3px;
            width: 40px;
            height: 40px;
            font-size: 1.5rem;
        }

        .backspace {
            display: flex;
            background-color: black;
            text-align: center;
            align-items: center;
            justify-content: center;
            margin: 0;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: black 2px solid;
            font-size: 1.7rem;
            padding: 0;
        }

        .orange{
            background-color: orange;
        }

        .display-row{
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }
        
        h1{
            color: white;
            margin-bottom: 10px;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Calculadora</h1>
        <div class="display-row">
            <div class="eval">
                <p class="js-calculation calculation">
                </p>
            </div>
                <button class="backspace" onclick="removeLastCharacter();">⌫</button>
        </div>
        <p>
            <button onclick="
            updateCalculation('1');
            console.log(calculation);
            ">
            1
            </button>
            
            <button onclick="
            updateCalculation('2');
            console.log(calculation);
            ">
            2
            </button>
            
            <button onclick="
            updateCalculation('3');
            console.log(calculation);
            ">
            3
            </button>
            
            <button class="orange" onclick="
            updateCalculation('+');
            console.log(calculation);
            ">
            +
            </button>
        </p>
        <p>
            <button onclick="
            updateCalculation('4');
            console.log(calculation);
            ">
            4
            </button>
            
            <button onclick="
            updateCalculation('5');
            console.log(calculation);
            ">
            5
            </button>
            
            <button onclick="
            updateCalculation('6');
            console.log(calculation);
            ">
            6
            </button>            
            <button class="orange" onclick="
            updateCalculation('-');
            console.log(calculation);
            ">
            -
            </button>
        </p>
        <p>
            <button onclick="
            updateCalculation('7');
            console.log(calculation);
            ">
            7
            </button>
            
            <button onclick="
            updateCalculation('8');
            console.log(calculation);
            ">
            8
            </button>
            
            <button onclick="
            updateCalculation('9');
            console.log(calculation);
            ">
            9
            </button>
            
            <button class="orange" onclick="
            updateCalculation('*');
            console.log(calculation);
            ">
            *
            </button>
        </p>
        <p>
            <button onclick="
            updateCalculation('0');
            console.log(calculation);
            ">
            0
            </button>
            
            <button onclick="
            updateCalculation('.');
            console.log(calculation);
            ">
            .
            </button>
            
            <button onclick="
            calculation = eval(calculation);
            
            displayCalculation();
            localStorage.setItem('calculation', calculation);
            ">
            =
            </button>
            
            <button class="orange" onclick="
            updateCalculation('/');
            console.log(calculation);
            ">
            /
            </button>
        </p>
        <button class="clear" onclick="
            calculation = '0';
            displayCalculation();
            localStorage.setItem('calculation', calculation);
            ">
            Clear
        </button>
    </div>
</body>

<script>
    let calculation = localStorage.getItem('calculation') || '';
    
    displayCalculation();

    function updateCalculation(value) {
        calculation +=value;

        displayCalculation();
        
        localStorage.setItem('calculation', calculation)
    }

    function displayCalculation() {
        document.querySelector('.js-calculation')
        .innerHTML = calculation
    }

    function removeLastCharacter() {
    if (calculation.length > 0) {
        calculation = calculation.slice(0, -1);
        displayCalculation();
        localStorage.setItem('calculation', calculation);
        }
    }
</script>
</html>
